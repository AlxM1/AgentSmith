# =============================================================================
# PostgreSQL Configuration for AgentSmith
# =============================================================================
# Optimized for a typical self-hosted deployment (4-8GB RAM, SSD storage)
# Adjust values based on your actual server resources
# =============================================================================

# -----------------------------------------------------------------------------
# CONNECTION SETTINGS
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100

# -----------------------------------------------------------------------------
# MEMORY SETTINGS
# -----------------------------------------------------------------------------
# Shared memory for caching (recommend 25% of total RAM)
shared_buffers = 512MB

# Memory for complex operations (per connection)
work_mem = 16MB

# Memory for maintenance operations (vacuum, index creation)
maintenance_work_mem = 128MB

# Memory for effective caching (recommend 50-75% of total RAM)
effective_cache_size = 1536MB

# -----------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL)
# -----------------------------------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# -----------------------------------------------------------------------------
# QUERY PLANNER
# -----------------------------------------------------------------------------
# Random page cost for SSD storage (lower for SSD, higher for HDD)
random_page_cost = 1.1
effective_io_concurrency = 200

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# Log slow queries (over 1 second)
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# -----------------------------------------------------------------------------
# AUTOVACUUM
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# -----------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
# -----------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
