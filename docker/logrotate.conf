# AgentSmith Log Rotation Configuration
# Place this file in /etc/logrotate.d/agentsmith on the host system

/var/log/agentsmith/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 root adm
    sharedscripts
    postrotate
        # Signal containers to reopen log files if needed
        docker kill --signal=USR1 agentsmith-backend 2>/dev/null || true
        docker kill --signal=USR1 agentsmith-worker 2>/dev/null || true
    endscript
}

# Alternative: Use Docker's built-in log rotation
# Configure in docker-compose.yml:
#
# logging:
#   driver: "json-file"
#   options:
#     max-size: "100m"
#     max-file: "5"
