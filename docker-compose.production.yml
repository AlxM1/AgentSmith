version: '3.8'

# =============================================================================
# AgentSmith Production Configuration
# =============================================================================
#
# This is a production-ready configuration for self-hosted deployment.
#
# SECURITY NOTES:
# - Always use strong passwords and secrets
# - Keep environment file secure (chmod 600 .env)
# - Use a reverse proxy (nginx/traefik) for SSL termination
# - Regular backups of postgres_data volume recommended
#
# USAGE:
#   1. Copy .env.example to .env and configure all values
#   2. docker compose -f docker-compose.production.yml up -d
#   3. Access frontend at http://localhost:3000
#   4. Access admin panel at http://localhost:3001
# =============================================================================

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: agentsmith-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      # Performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agentsmith-internal
    # Security: Don't expose port externally in production
    # Remove this if you need external DB access
    # ports:
    #   - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================
  # Redis (Queues & Caching)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: agentsmith-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentsmith-internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M

  # ============================================
  # Backend API Server
  # ============================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        NODE_ENV: production
    container_name: agentsmith-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Security (IMPORTANT: Change these in production!)
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      AUTH_RATE_LIMIT_MAX: 10

      # CORS (set to your domain)
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # WebSocket
      WS_HEARTBEAT_INTERVAL: 30000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentsmith-internal
      - agentsmith-web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ============================================
  # Worker (Execution Engine)
  # ============================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        NODE_ENV: production
    container_name: agentsmith-worker
    restart: always
    environment:
      NODE_ENV: production

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Security
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Worker Configuration
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      EXECUTION_TIMEOUT: ${EXECUTION_TIMEOUT:-3600000}
      MAX_RETRIES: ${MAX_RETRIES:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentsmith-internal
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      # Scale workers as needed
      # replicas: 2

  # ============================================
  # Frontend (User Interface)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NODE_ENV: production
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000/ws}
    container_name: agentsmith-frontend
    restart: always
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - agentsmith-web
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ============================================
  # Admin Panel
  # ============================================
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        NODE_ENV: production
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: agentsmith-admin
    restart: always
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend
    networks:
      - agentsmith-web
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ============================================
  # Nginx Reverse Proxy (Optional but recommended)
  # ============================================
  # Uncomment this section to use nginx for SSL termination
  # and unified access through a single port
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: agentsmith-nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./docker/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend
  #     - admin
  #     - backend
  #   networks:
  #     - agentsmith-web

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  # Internal network - databases and services
  agentsmith-internal:
    driver: bridge
    internal: true

  # Web network - exposed services
  agentsmith-web:
    driver: bridge
