# AgentSmith Helm Chart Values
# Enterprise Workflow Orchestration Platform

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Image configuration
image:
  registry: docker.io
  repository: agentsmith/agentsmith
  tag: "latest"
  pullPolicy: IfNotPresent

# Replica configuration
replicaCount:
  main: 2
  worker: 3
  webhook: 2

# High Availability settings
highAvailability:
  enabled: true
  leaderElection: true

# Main application configuration
main:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - main
            topologyKey: kubernetes.io/hostname

# Worker configuration
worker:
  enabled: true
  replicas: 3
  concurrency: 10
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
    # Custom metrics for queue depth
    customMetrics:
      - type: External
        external:
          metric:
            name: agentsmith_queue_depth
          target:
            type: AverageValue
            averageValue: "100"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Webhook processor configuration
webhook:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# Service configuration
service:
  type: ClusterIP
  port: 3000
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "agentsmith"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: agentsmith.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: agentsmith-tls
      hosts:
        - agentsmith.example.com

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: ""  # Set via --set or secrets
    username: agentsmith
    password: ""  # Set via --set or secrets
    database: agentsmith
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  readReplicas:
    replicaCount: 2
    persistence:
      enabled: true
      size: 20Gi

# Redis configuration
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    password: ""  # Set via --set or secrets
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 8Gi

# External database (if not using bundled PostgreSQL)
externalDatabase:
  enabled: false
  host: ""
  port: 5432
  username: agentsmith
  password: ""
  database: agentsmith
  ssl: true
  sslMode: require

# External Redis (if not using bundled Redis)
externalRedis:
  enabled: false
  host: ""
  port: 6379
  password: ""
  ssl: true

# Application configuration
config:
  # Node environment
  nodeEnv: production

  # Encryption key (generate with: openssl rand -hex 32)
  encryptionKey: ""

  # JWT settings
  jwt:
    secret: ""  # Generate a strong secret
    expiresIn: "24h"

  # CORS settings
  cors:
    origins:
      - https://agentsmith.example.com

  # Rate limiting
  rateLimit:
    windowMs: 60000
    max: 100

  # Queue settings
  queue:
    defaultTimeout: 300000
    maxRetries: 3

  # Execution settings
  executions:
    pruneDataMaxAge: 336  # hours (14 days)
    pruneDataMaxCount: 10000

  # Log level
  logLevel: info

# SSO Configuration
sso:
  enabled: false
  # SAML
  saml:
    enabled: false
    entryPoint: ""
    issuer: ""
    cert: ""
    attributeMapping:
      email: "email"
      firstName: "firstName"
      lastName: "lastName"
  # OIDC
  oidc:
    enabled: false
    clientId: ""
    clientSecret: ""
    issuer: ""
    authorizationUrl: ""
    tokenUrl: ""
    userInfoUrl: ""
  # LDAP
  ldap:
    enabled: false
    url: ""
    bindDn: ""
    bindPassword: ""
    searchBase: ""
    searchFilter: "(uid={{username}})"

# External secrets
externalSecrets:
  enabled: false
  # HashiCorp Vault
  vault:
    enabled: false
    address: ""
    token: ""
    path: "secret/data/agentsmith"
  # AWS Secrets Manager
  aws:
    enabled: false
    region: ""
    secretName: ""
  # Azure Key Vault
  azure:
    enabled: false
    vaultUrl: ""
    tenantId: ""
    clientId: ""
    clientSecret: ""

# Log streaming
logStreaming:
  enabled: false
  destinations:
    # Datadog
    datadog:
      enabled: false
      apiKey: ""
      site: "datadoghq.com"
    # Splunk
    splunk:
      enabled: false
      hecUrl: ""
      hecToken: ""
    # Elasticsearch
    elasticsearch:
      enabled: false
      url: ""
      index: "agentsmith-logs"
    # Loki
    loki:
      enabled: false
      url: ""

# Metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s

# Persistence
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Pod security context
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC
rbac:
  create: true

# Probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# Extra environment variables
extraEnv: []

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

# Annotations for all pods
podAnnotations: {}

# Labels for all pods
podLabels: {}

# ============================================
# Backup Configuration
# ============================================
backup:
  enabled: true
  # Cron schedule (default: daily at 2 AM)
  schedule: "0 2 * * *"
  # Timeout in seconds
  timeout: 3600
  # Number of retries
  retries: 2
  # History limits
  historyLimit:
    successful: 3
    failed: 3

  # S3 backup configuration
  s3:
    enabled: false
    bucket: ""
    prefix: "backups/agentsmith"
    region: "us-east-1"
    accessKeyId: ""
    secretAccessKey: ""
    storageClass: "STANDARD_IA"

  # Local storage (if S3 not enabled)
  storage:
    size: "50Gi"
    storageClass: ""

  # Backup encryption
  encryptionKey: ""

  # Retention policy
  retention:
    enabled: true
    days: 30

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ============================================
# Secrets Rotation Configuration
# ============================================
secretsRotation:
  enabled: true
  # Cron schedule (default: every 6 hours)
  schedule: "0 */6 * * *"
  # Log level
  logLevel: "info"
  # Dry run mode (for testing)
  dryRun: false

  # Image configuration
  image:
    repository: agentsmith/secrets-rotation
    tag: "latest"
    pullPolicy: IfNotPresent

  # Service account
  serviceAccount:
    annotations: {}
    # For AWS IRSA:
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/SecretsRotationRole

  # Node selection
  nodeSelector: {}
  tolerations: []

  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Rotation policies by secret type
  policies:
    database:
      rotationDays: 90
      gracePeriodHours: 24
      notifyDaysBefore: [30, 7, 1]
      requireApproval: true
    api_key:
      rotationDays: 30
      gracePeriodHours: 4
      notifyDaysBefore: [7, 1]
      requireApproval: false
    jwt_secret:
      rotationDays: 7
      gracePeriodHours: 1
      notifyDaysBefore: [3, 1]
      requireApproval: false
    encryption_key:
      rotationDays: 365
      gracePeriodHours: 48
      notifyDaysBefore: [60, 30, 7]
      requireApproval: true
    webhook_secret:
      rotationDays: 30
      gracePeriodHours: 4
      notifyDaysBefore: [7, 1]
      requireApproval: false

  # Secrets to manage
  secrets:
    - id: jwt-secret
      name: JWT Secret
      type: jwt_secret
      rotationDays: 7
      enabled: true
      kubernetesSecret:
        name: agentsmith-secrets
        key: jwt-secret
    - id: api-encryption-key
      name: API Encryption Key
      type: encryption_key
      rotationDays: 365
      enabled: true
      kubernetesSecret:
        name: agentsmith-secrets
        key: encryption-key
    - id: webhook-signing-key
      name: Webhook Signing Key
      type: webhook_secret
      rotationDays: 30
      enabled: true
      kubernetesSecret:
        name: agentsmith-secrets
        key: webhook-secret

  # Notifications
  notifications:
    enabled: true
    slack:
      enabled: false
      webhookUrl: ""
      channel: "#security-alerts"
    email:
      enabled: false
      recipients: "security@example.com"

  # HashiCorp Vault integration
  vault:
    enabled: false
    address: ""
    secretName: vault-token
    path: "secret/data/agentsmith"

  # AWS Secrets Manager integration
  aws:
    enabled: false
    region: "us-east-1"
    secretName: aws-credentials

# ============================================
# Blue-Green Deployment Configuration
# ============================================
blueGreen:
  # Enable blue-green deployments (requires Argo Rollouts)
  enabled: false

  # Preview replicas (for testing new version)
  previewReplicas: 1

  # Delay before scaling down old version (seconds)
  scaleDownDelaySeconds: 300

  # Auto-promotion configuration
  autoPromotion:
    # Automatically promote after analysis passes
    enabled: true
    # Seconds to wait before auto-promotion
    seconds: 60

  # Analysis configuration
  analysis:
    # Enable pre/post promotion analysis
    enabled: true
    # Prometheus address for metrics
    prometheusAddress: "http://prometheus-server.monitoring:80"

  # Traffic management
  trafficRouting:
    # Use Istio for traffic management
    istio:
      enabled: false
      virtualService:
        name: agentsmith-vsvc
        routes:
          - primary
    # Use Nginx for traffic management
    nginx:
      enabled: false
      stableIngress: agentsmith-stable
      annotationPrefix: nginx.ingress.kubernetes.io

# ============================================
# Canary Deployment Configuration
# ============================================
canary:
  # Enable canary deployments (alternative to blue-green)
  enabled: false

  # Canary steps
  steps:
    - setWeight: 5
    - pause: { duration: 1m }
    - setWeight: 10
    - pause: { duration: 2m }
    - setWeight: 25
    - pause: { duration: 5m }
    - setWeight: 50
    - pause: { duration: 10m }
    - setWeight: 75
    - pause: { duration: 10m }
    - setWeight: 100

  # Maximum surge during deployment
  maxSurge: "25%"
  # Maximum unavailable during deployment
  maxUnavailable: 0

  # Analysis during canary
  analysis:
    enabled: true
    startingStep: 2
    templates:
      - templateName: agentsmith-canary-analysis

# ============================================
# CDN Configuration
# ============================================
cdn:
  enabled: false
  provider: "cloudfront"  # cloudfront, cloudflare, or custom

  # CloudFront configuration
  cloudfront:
    distributionId: ""
    originDomain: ""

  # Cloudflare configuration
  cloudflare:
    zoneId: ""
    apiToken: ""

  # Cache control headers
  cacheControl:
    static: "public, max-age=31536000, immutable"
    images: "public, max-age=2592000"
    html: "public, max-age=300"
    api: "no-cache, no-store, must-revalidate"
