apiVersion: v2
name: agentsmith
description: AgentSmith - Enterprise Workflow Orchestration Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - workflow
  - automation
  - orchestration
  - n8n-alternative
home: https://github.com/agentsmith/agentsmith
sources:
  - https://github.com/agentsmith/agentsmith
maintainers:
  - name: AgentSmith Team
    email: team@agentsmith.io
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
