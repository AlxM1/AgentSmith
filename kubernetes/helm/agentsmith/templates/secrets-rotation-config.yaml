{{- if .Values.secretsRotation.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentsmith.fullname" . }}-secrets-rotation-config
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-rotation
data:
  ROTATION_LOG_LEVEL: {{ .Values.secretsRotation.logLevel | quote }}
  ROTATION_DRY_RUN: {{ .Values.secretsRotation.dryRun | quote }}
  NOTIFICATION_ENABLED: {{ .Values.secretsRotation.notifications.enabled | quote }}
  {{- if .Values.secretsRotation.notifications.slack.enabled }}
  SLACK_WEBHOOK_URL: {{ .Values.secretsRotation.notifications.slack.webhookUrl | quote }}
  SLACK_CHANNEL: {{ .Values.secretsRotation.notifications.slack.channel | quote }}
  {{- end }}
  {{- if .Values.secretsRotation.notifications.email.enabled }}
  EMAIL_ENABLED: "true"
  EMAIL_RECIPIENTS: {{ .Values.secretsRotation.notifications.email.recipients | quote }}
  {{- end }}

  rotation-policies.json: |
    {
      "policies": {
        {{- range $type, $policy := .Values.secretsRotation.policies }}
        "{{ $type }}": {
          "rotationDays": {{ $policy.rotationDays }},
          "gracePeriodHours": {{ $policy.gracePeriodHours | default 24 }},
          "notifyDaysBefore": {{ $policy.notifyDaysBefore | default (list 30 7 1) | toJson }},
          "requireApproval": {{ $policy.requireApproval | default false }}
        }{{ if not (last (keys $.Values.secretsRotation.policies)) }},{{ end }}
        {{- end }}
      },
      "secrets": [
        {{- range $index, $secret := .Values.secretsRotation.secrets }}
        {{- if $index }},{{ end }}
        {
          "id": {{ $secret.id | quote }},
          "name": {{ $secret.name | quote }},
          "type": {{ $secret.type | quote }},
          "rotationDays": {{ $secret.rotationDays | default 90 }},
          "enabled": {{ $secret.enabled | default true }},
          "kubernetesSecret": {
            "name": {{ $secret.kubernetesSecret.name | quote }},
            "key": {{ $secret.kubernetesSecret.key | quote }}
          }
          {{- if $secret.metadata }},
          "metadata": {{ $secret.metadata | toJson }}
          {{- end }}
        }
        {{- end }}
      ]
    }

  rotate-secrets.js: |
    #!/usr/bin/env node
    /**
     * Secrets Rotation Script
     * Kubernetes CronJob entry point
     */

    const fs = require('fs');
    const https = require('https');
    const { execSync } = require('child_process');

    const DRY_RUN = process.env.ROTATION_DRY_RUN === 'true';
    const LOG_LEVEL = process.env.ROTATION_LOG_LEVEL || 'info';

    function log(level, message, data = {}) {
      const levels = { debug: 0, info: 1, warn: 2, error: 3 };
      if (levels[level] >= levels[LOG_LEVEL]) {
        console.log(JSON.stringify({
          timestamp: new Date().toISOString(),
          level,
          message,
          ...data
        }));
      }
    }

    function generateSecureKey(length = 32) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const crypto = require('crypto');
      const randomBytes = crypto.randomBytes(length);
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars[randomBytes[i] % chars.length];
      }
      return result;
    }

    async function getKubernetesSecret(namespace, name, key) {
      try {
        const result = execSync(
          `kubectl get secret ${name} -n ${namespace} -o jsonpath='{.data.${key}}'`,
          { encoding: 'utf8' }
        );
        return Buffer.from(result, 'base64').toString('utf8');
      } catch (error) {
        log('error', 'Failed to get secret', { name, key, error: error.message });
        return null;
      }
    }

    async function updateKubernetesSecret(namespace, name, key, value) {
      if (DRY_RUN) {
        log('info', 'DRY RUN: Would update secret', { namespace, name, key });
        return true;
      }

      try {
        const base64Value = Buffer.from(value).toString('base64');
        execSync(
          `kubectl patch secret ${name} -n ${namespace} -p '{"data":{"${key}":"${base64Value}"}}'`,
          { encoding: 'utf8' }
        );
        log('info', 'Secret updated successfully', { namespace, name, key });
        return true;
      } catch (error) {
        log('error', 'Failed to update secret', { name, key, error: error.message });
        return false;
      }
    }

    function shouldRotate(lastRotated, rotationDays) {
      if (!lastRotated) return true;
      const lastDate = new Date(lastRotated);
      const now = new Date();
      const daysSince = Math.floor((now - lastDate) / (1000 * 60 * 60 * 24));
      return daysSince >= rotationDays;
    }

    async function sendNotification(type, data) {
      if (process.env.NOTIFICATION_ENABLED !== 'true') return;

      if (process.env.SLACK_WEBHOOK_URL) {
        const message = {
          channel: process.env.SLACK_CHANNEL || '#alerts',
          username: 'Secrets Rotation Bot',
          icon_emoji: type === 'success' ? ':white_check_mark:' : ':warning:',
          text: type === 'success'
            ? `✅ Secret rotation completed: ${data.secretId}`
            : `⚠️ Secret rotation warning: ${data.message}`
        };

        try {
          const url = new URL(process.env.SLACK_WEBHOOK_URL);
          const postData = JSON.stringify(message);

          await new Promise((resolve, reject) => {
            const req = https.request({
              hostname: url.hostname,
              path: url.pathname,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Content-Length': postData.length
              }
            }, (res) => {
              res.on('end', resolve);
            });
            req.on('error', reject);
            req.write(postData);
            req.end();
          });
        } catch (error) {
          log('warn', 'Failed to send Slack notification', { error: error.message });
        }
      }
    }

    async function main() {
      log('info', 'Starting secrets rotation check', { dryRun: DRY_RUN });

      // Load rotation config
      let config;
      try {
        config = JSON.parse(fs.readFileSync('/app/config/rotation-policies.json', 'utf8'));
      } catch (error) {
        log('error', 'Failed to load rotation config', { error: error.message });
        process.exit(1);
      }

      const namespace = process.env.POD_NAMESPACE || 'default';
      const results = { rotated: 0, skipped: 0, failed: 0 };

      for (const secret of config.secrets) {
        if (!secret.enabled) {
          log('debug', 'Secret disabled, skipping', { secretId: secret.id });
          results.skipped++;
          continue;
        }

        log('info', 'Checking secret', { secretId: secret.id, type: secret.type });

        // Check if rotation is needed
        const policy = config.policies[secret.type] || { rotationDays: 90 };
        const rotationDays = secret.rotationDays || policy.rotationDays;

        // Get last rotation time from annotation
        let lastRotated;
        try {
          lastRotated = execSync(
            `kubectl get secret ${secret.kubernetesSecret.name} -n ${namespace} -o jsonpath='{.metadata.annotations.agentsmith\\.io/last-rotated}'`,
            { encoding: 'utf8' }
          ).replace(/'/g, '');
        } catch {
          lastRotated = null;
        }

        if (!shouldRotate(lastRotated, rotationDays)) {
          log('debug', 'Secret not due for rotation', {
            secretId: secret.id,
            lastRotated,
            rotationDays
          });
          results.skipped++;
          continue;
        }

        // Check if approval is required
        if (policy.requireApproval) {
          log('warn', 'Secret requires approval for rotation', { secretId: secret.id });
          await sendNotification('warning', {
            message: `Secret ${secret.id} requires manual approval for rotation`
          });
          results.skipped++;
          continue;
        }

        // Generate new secret value based on type
        let newValue;
        switch (secret.type) {
          case 'api_key':
            newValue = generateSecureKey(32);
            break;
          case 'jwt_secret':
            newValue = generateSecureKey(64);
            break;
          case 'encryption_key':
            newValue = require('crypto').randomBytes(32).toString('hex');
            break;
          case 'webhook_secret':
            newValue = generateSecureKey(32);
            break;
          default:
            newValue = generateSecureKey(32);
        }

        // Update the secret
        const success = await updateKubernetesSecret(
          namespace,
          secret.kubernetesSecret.name,
          secret.kubernetesSecret.key,
          newValue
        );

        if (success) {
          // Update last-rotated annotation
          if (!DRY_RUN) {
            try {
              execSync(
                `kubectl annotate secret ${secret.kubernetesSecret.name} -n ${namespace} --overwrite agentsmith.io/last-rotated="${new Date().toISOString()}"`,
                { encoding: 'utf8' }
              );
            } catch (error) {
              log('warn', 'Failed to update rotation annotation', { error: error.message });
            }
          }

          results.rotated++;
          await sendNotification('success', { secretId: secret.id });
        } else {
          results.failed++;
        }
      }

      log('info', 'Secrets rotation check completed', results);

      if (results.failed > 0) {
        process.exit(1);
      }
    }

    main().catch((error) => {
      log('error', 'Secrets rotation failed', { error: error.message, stack: error.stack });
      process.exit(1);
    });
{{- end }}
