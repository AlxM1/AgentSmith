{{- if .Values.blueGreen.enabled }}
# Argo Rollouts Blue-Green Deployment Strategy
# Requires: kubectl apply -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "agentsmith.fullname" . }}
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.main.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "agentsmith.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: main
  template:
    metadata:
      labels:
        {{- include "agentsmith.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: main
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agentsmith.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "agentsmith.fullname" . }}-config
            - secretRef:
                name: {{ include "agentsmith.fullname" . }}-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            {{- if .Values.livenessProbe.enabled }}
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            {{- end }}
          readinessProbe:
            {{- if .Values.readinessProbe.enabled }}
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            {{- end }}
          resources:
            {{- toYaml .Values.main.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "agentsmith.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.main.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.main.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.main.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  strategy:
    blueGreen:
      # Active service (production traffic)
      activeService: {{ include "agentsmith.fullname" . }}-active
      # Preview service (for testing before promotion)
      previewService: {{ include "agentsmith.fullname" . }}-preview
      # Automatically promote after successful analysis
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotion.enabled }}
      {{- if .Values.blueGreen.autoPromotion.enabled }}
      autoPromotionSeconds: {{ .Values.blueGreen.autoPromotion.seconds }}
      {{- end }}
      # Scale down delay after promotion
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
      # Number of previous ReplicaSets to keep
      scaleDownDelayRevisionLimit: 2
      # Preview ReplicaSet scaling
      previewReplicaCount: {{ .Values.blueGreen.previewReplicas }}
      # Anti-affinity for blue/green pods
      antiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          weight: 100
      {{- if .Values.blueGreen.analysis.enabled }}
      # Pre-promotion analysis
      prePromotionAnalysis:
        templates:
          - templateName: {{ include "agentsmith.fullname" . }}-pre-promotion
        args:
          - name: service-name
            value: {{ include "agentsmith.fullname" . }}-preview
      # Post-promotion analysis
      postPromotionAnalysis:
        templates:
          - templateName: {{ include "agentsmith.fullname" . }}-post-promotion
        args:
          - name: service-name
            value: {{ include "agentsmith.fullname" . }}-active
      {{- end }}
---
# Active service (receives production traffic)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentsmith.fullname" . }}-active
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
    app.kubernetes.io/component: active
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "agentsmith.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: main
---
# Preview service (for testing new version)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentsmith.fullname" . }}-preview
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "agentsmith.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: main
{{- end }}
