apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentsmith.fullname" . }}-secret
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
type: Opaque
data:
  # Encryption key (must be 64 hex chars / 32 bytes)
  {{- if .Values.config.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.config.encryptionKey | b64enc | quote }}
  {{- else }}
  ENCRYPTION_KEY: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}

  # JWT Secret
  {{- if .Values.config.jwt.secret }}
  JWT_SECRET: {{ .Values.config.jwt.secret | b64enc | quote }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}

  # Database password
  {{- if .Values.postgresql.enabled }}
  DB_PASSWORD: {{ .Values.postgresql.auth.password | default (randAlphaNum 32) | b64enc | quote }}
  {{- else if .Values.externalDatabase.enabled }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}

  # Redis password
  {{- if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | default (randAlphaNum 32) | b64enc | quote }}
  {{- else if .Values.externalRedis.enabled }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | b64enc | quote }}
  {{- end }}

  # SSO Secrets
  {{- if .Values.sso.enabled }}
  {{- if .Values.sso.oidc.enabled }}
  OIDC_CLIENT_ID: {{ .Values.sso.oidc.clientId | b64enc | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.sso.oidc.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.sso.ldap.enabled }}
  LDAP_BIND_DN: {{ .Values.sso.ldap.bindDn | b64enc | quote }}
  LDAP_BIND_PASSWORD: {{ .Values.sso.ldap.bindPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.sso.saml.enabled }}
  SAML_CERT: {{ .Values.sso.saml.cert | b64enc | quote }}
  {{- end }}
  {{- end }}

  # External Secrets tokens
  {{- if .Values.externalSecrets.enabled }}
  {{- if .Values.externalSecrets.vault.enabled }}
  VAULT_TOKEN: {{ .Values.externalSecrets.vault.token | b64enc | quote }}
  {{- end }}
  {{- if .Values.externalSecrets.azure.enabled }}
  AZURE_CLIENT_ID: {{ .Values.externalSecrets.azure.clientId | b64enc | quote }}
  AZURE_CLIENT_SECRET: {{ .Values.externalSecrets.azure.clientSecret | b64enc | quote }}
  AZURE_TENANT_ID: {{ .Values.externalSecrets.azure.tenantId | b64enc | quote }}
  {{- end }}
  {{- end }}

  # Log Streaming tokens
  {{- if .Values.logStreaming.enabled }}
  {{- if .Values.logStreaming.destinations.datadog.enabled }}
  DATADOG_API_KEY: {{ .Values.logStreaming.destinations.datadog.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.logStreaming.destinations.splunk.enabled }}
  SPLUNK_HEC_TOKEN: {{ .Values.logStreaming.destinations.splunk.hecToken | b64enc | quote }}
  {{- end }}
  {{- end }}
