{{- if .Values.secretsRotation.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "agentsmith.fullname" . }}-secrets-rotation
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-rotation
spec:
  schedule: {{ .Values.secretsRotation.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "agentsmith.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: secrets-rotation
          annotations:
            checksum/config: {{ include (print $.Template.BasePath "/secrets-rotation-config.yaml") . | sha256sum }}
        spec:
          serviceAccountName: {{ include "agentsmith.fullname" . }}-secrets-rotation
          restartPolicy: OnFailure
          {{- with .Values.secretsRotation.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.secretsRotation.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: secrets-rotation
              image: "{{ .Values.secretsRotation.image.repository }}:{{ .Values.secretsRotation.image.tag }}"
              imagePullPolicy: {{ .Values.secretsRotation.image.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Starting secrets rotation check..."

                  # Run the rotation check
                  node /app/scripts/rotate-secrets.js

                  # Send notification if configured
                  if [ -n "$SLACK_WEBHOOK_URL" ]; then
                    curl -X POST -H 'Content-type: application/json' \
                      --data '{"text":"Secrets rotation completed successfully"}' \
                      $SLACK_WEBHOOK_URL || true
                  fi

                  echo "Secrets rotation check completed"
              envFrom:
                - configMapRef:
                    name: {{ include "agentsmith.fullname" . }}-secrets-rotation-config
                - secretRef:
                    name: {{ include "agentsmith.fullname" . }}-secrets-rotation-credentials
                    optional: true
              env:
                - name: NODE_ENV
                  value: "production"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "agentsmith.fullname" . }}-database
                      key: url
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "agentsmith.fullname" . }}-redis
                      key: url
                      optional: true
                {{- if .Values.secretsRotation.vault.enabled }}
                - name: VAULT_ADDR
                  value: {{ .Values.secretsRotation.vault.address | quote }}
                - name: VAULT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretsRotation.vault.secretName }}
                      key: token
                {{- end }}
                {{- if .Values.secretsRotation.aws.enabled }}
                - name: AWS_REGION
                  value: {{ .Values.secretsRotation.aws.region | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretsRotation.aws.secretName }}
                      key: access-key-id
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretsRotation.aws.secretName }}
                      key: secret-access-key
                      optional: true
                {{- end }}
              resources:
                {{- toYaml .Values.secretsRotation.resources | nindent 16 }}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: rotation-config
                  mountPath: /app/config
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: rotation-config
              configMap:
                name: {{ include "agentsmith.fullname" . }}-secrets-rotation-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentsmith.fullname" . }}-secrets-rotation
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
  {{- with .Values.secretsRotation.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentsmith.fullname" . }}-secrets-rotation
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentsmith.fullname" . }}-secrets-rotation
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentsmith.fullname" . }}-secrets-rotation
subjects:
  - kind: ServiceAccount
    name: {{ include "agentsmith.fullname" . }}-secrets-rotation
    namespace: {{ .Release.Namespace }}
{{- end }}
