apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentsmith.fullname" . }}
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "agentsmith.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: main
---
{{- if .Values.worker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentsmith.fullname" . }}-worker
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for workers
  ports:
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "agentsmith.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
---
{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentsmith.fullname" . }}-webhook
  labels:
    {{- include "agentsmith.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "agentsmith.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
{{- end }}
