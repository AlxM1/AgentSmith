# AWS CloudFront CDN Configuration for AgentSmith
# Deploy with: kubectl apply -f cloudfront-config.yaml

---
# ConfigMap containing CDN configuration settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentsmith-cdn-config
  namespace: agentsmith
  labels:
    app.kubernetes.io/name: agentsmith
    app.kubernetes.io/component: cdn
data:
  # CDN Configuration
  CDN_ENABLED: "true"
  CDN_PROVIDER: "cloudfront"

  # Cache behavior settings (in seconds)
  CACHE_TTL_STATIC: "31536000"    # 1 year for static assets (js, css, fonts)
  CACHE_TTL_IMAGES: "2592000"     # 30 days for images
  CACHE_TTL_API: "0"              # No caching for API
  CACHE_TTL_HTML: "300"           # 5 minutes for HTML

  # Compression
  COMPRESSION_ENABLED: "true"
  COMPRESSION_TYPES: "text/html,text/css,application/javascript,application/json,image/svg+xml"

  # Security headers
  X_CONTENT_TYPE_OPTIONS: "nosniff"
  X_FRAME_OPTIONS: "DENY"
  REFERRER_POLICY: "strict-origin-when-cross-origin"

  # CORS
  CORS_ALLOW_ORIGIN: "https://app.agentsmith.io"
  CORS_ALLOW_METHODS: "GET,HEAD,OPTIONS"

---
# Ingress configuration with CDN annotations
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentsmith-static
  namespace: agentsmith
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

    # Cache control headers for static assets
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Static asset caching
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
      }

      # HTML/JSON with shorter cache
      location ~* \.(html|json)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
      }

      # No cache for API endpoints
      location /api/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
      }

      # Compression
      gzip on;
      gzip_vary on;
      gzip_proxied any;
      gzip_comp_level 6;
      gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
spec:
  tls:
    - hosts:
        - app.agentsmith.io
        - cdn.agentsmith.io
      secretName: agentsmith-tls
  rules:
    - host: app.agentsmith.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentsmith-frontend
                port:
                  number: 80

---
# Origin configuration for CloudFront
apiVersion: v1
kind: Service
metadata:
  name: agentsmith-cdn-origin
  namespace: agentsmith
  annotations:
    # For AWS ALB Ingress Controller
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: agentsmith
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 80
