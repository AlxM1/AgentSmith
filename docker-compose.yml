version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agentsmith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentsmith
      POSTGRES_PASSWORD: agentsmith_password
      POSTGRES_DB: agentsmith
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsmith -d agentsmith"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for queues and caching)
  redis:
    image: redis:7-alpine
    container_name: agentsmith-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: agentsmith-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: agentsmith
      DB_USERNAME: agentsmith
      DB_PASSWORD: agentsmith_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      ENCRYPTION_KEY: dev-encryption-key-32chars!!
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/shared/src:/app/packages/shared/src

  # Worker (Execution Engine)
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: agentsmith-worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: agentsmith
      DB_USERNAME: agentsmith
      DB_PASSWORD: agentsmith_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: 5
      ENCRYPTION_KEY: dev-encryption-key-32chars!!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/worker/src:/app/packages/worker/src
      - ./packages/shared/src:/app/packages/shared/src

  # Frontend (Development Server)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: agentsmith-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/shared/src:/app/packages/shared/src

  # Admin Panel (Development Server)
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: agentsmith-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - backend
    volumes:
      - ./packages/admin/src:/app/packages/admin/src

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: agentsmith-network
