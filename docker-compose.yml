version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agentsmith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-agentsmith}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentsmith_password}
      POSTGRES_DB: ${DB_DATABASE:-agentsmith}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-agentsmith} -d ${DB_DATABASE:-agentsmith}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for queues and caching)
  redis:
    image: redis:7-alpine
    container_name: agentsmith-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: agentsmith-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-agentsmith}
      DB_USERNAME: ${DB_USERNAME:-agentsmith}
      DB_PASSWORD: ${DB_PASSWORD:-agentsmith_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Security
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32chars!!}
      # Instance
      INSTANCE_URL: ${INSTANCE_URL:-http://localhost:3000}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:4000}
      # SSO (optional)
      SSO_ENABLED: ${SSO_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      # Email (optional)
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@agentsmith.local}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/shared/src:/app/packages/shared/src
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Worker (Execution Engine)
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: agentsmith-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-agentsmith}
      DB_USERNAME: ${DB_USERNAME:-agentsmith}
      DB_PASSWORD: ${DB_PASSWORD:-agentsmith_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Worker settings
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      EXECUTION_TIMEOUT: ${EXECUTION_TIMEOUT:-3600}
      # Security
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32chars!!}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./packages/worker/src:/app/packages/worker/src
      - ./packages/shared/src:/app/packages/shared/src

  # Frontend (Development Server)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: agentsmith-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api/v1
      VITE_BACKEND_URL: http://backend:4000
      VITE_WS_URL: ws://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/shared/src:/app/packages/shared/src

  # Admin Panel (Development Server)
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: agentsmith-admin
    restart: unless-stopped
    environment:
      VITE_API_URL: /api/v1
      VITE_BACKEND_URL: http://backend:4000
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./packages/admin/src:/app/packages/admin/src

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: agentsmith-network
